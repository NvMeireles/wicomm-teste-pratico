<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Amakha Paris: perfumes, cosméticos e cuidados para cabelos, corpo e rosto.">
  <title>Amakha Paris</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/announcement-bar.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body>

  <!-- Barra de anúncio -->
  <div class="announcement-bar">
    <p class="announcement-bar__content">
      <span class="announcement-bar__title">SEMANA DO <strong>CONSUMIDOR</strong></span>
      <img class="announcement-bar__star" src="images/Star 2.svg" alt="" width="14" height="14">
      <span class="announcement-bar__pill">FRETE GRÁTIS EM COMPRAS ACIMA DE R$ 199,90</span>
    </p>
  </div>

  <!-- Cabeçalho -->
 
<header class="header">
  <div class="header__top">
    <a href="/" class="header__logo">
      <img src="images/AMAKHA_LOGO_VERTICAL_PRETA.svg" alt="Amakha Paris" width="108" height="54">
    </a>

    <form class="search" role="search">
      <input class="search__input" type="search" placeholder="Qual produto você procura?" aria-label="Buscar produtos">
      <button class="search__button" type="submit" aria-label="Buscar">
        <img src="images/search-normal.svg" alt="" width="22" height="22">
      </button>
    </form>

    <a href="#" class="account">
      <img src="images/profile-circle.svg" alt="" width="22" height="22">
      <span class="account__text">
        <strong>MINHA CONTA</strong>
        Entre ou cadastre-se
      </span>
    </a>

    <button class="icon-button" aria-label="Favoritos">
      <img src="images/heart.svg" alt="" width="22" height="22">
    </button>
    <button class="icon-button icon-button--bag" aria-label="Abrir carrinho, 3 itens">
  <img src="images/shopping-bag.svg" alt="" width="22" height="22.73">
  <span class="bag-count" aria-hidden="true">3</span>
</button>
  </div>

  <nav class="menu" aria-label="Menu principal">
  <ul class="menu__list">
    <li><a href="#" class="menu__link">Perfumaria <img class="menu__arrow" src="images/arrow.svg" alt="" width="6" height="11"></a></li>
    <li><a href="#" class="menu__link">Cabelos <img class="menu__arrow" src="images/arrow.svg" alt="" width="6" height="11"></a></li>
    <li><a href="#" class="menu__link">Corpo e Banho <img class="menu__arrow" src="images/arrow.svg" alt="" width="6" height="11"></a></li>
    <li><a href="#" class="menu__link">Rosto <img class="menu__arrow" src="images/arrow.svg" alt="" width="6" height="11"></a></li>
    <li><a href="#" class="menu__link">Nutricional <img class="menu__arrow" src="images/arrow.svg" alt="" width="6" height="11"></a></li>
    <li>
      <a href="#" class="menu__link menu__link--outline">
        <img src="images/people.svg" alt="" width="24" height="24">
        Revenda
        <img class="menu__arrow" src="images/arrow.svg" alt="" width="6" height="11">
      </a>
    </li>
    <li>
      <a href="#" class="menu__link menu__link--promo">
        <img src="images/discount-shape.svg" alt="" width="24" height="24">
        Promoções
      </a>
    </li>
  </ul>
</nav>
</header>   

  <main>
    
  </main>

  <script src="js/main.js"></script>
</body>
</html>
